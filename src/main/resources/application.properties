spring.application.name=precoreal

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# =============================================================
# IBPT
# URL de download da tabela de alíquotas — atualizar a cada trimestre (ibpt.org.br)
# {uf} é substituído pelo código do estado durante a sincronização
# =============================================================
ibpt.download.url-template=https://api-ibpt.seunegocionanuvem.com.br/api_ibpt_json.php?uf={uf}
ibpt.ufs=AC,AL,AM,AP,BA,CE,DF,ES,GO,MA,MG,MS,MT,PA,PB,PE,PI,PR,RJ,RN,RO,RR,RS,SC,SE,SP,TO

# =============================================================
# Provedor de IA
# Valores aceitos: "anthropic" ou "openai"
# Pode ser sobrescrito pela variável de ambiente AI_PROVIDER
# =============================================================
ai.provider=${AI_PROVIDER:openai}

# --- Anthropic (usado quando ai.provider=anthropic) ---
# A api-key é lida da variável de ambiente ANTHROPIC_API_KEY
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:256}

# --- OpenAI (usado quando ai.provider=openai) ---
# A api-key é lida da variável de ambiente OPENAI_API_KEY
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.max-tokens=${OPENAI_MAX_TOKENS:256}
