spring.application.name=precoreal

# H2 in-memory (dev) — troque pelo perfil prod para PostgreSQL
spring.datasource.url=jdbc:h2:mem:precoreal;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true


# IBPT — atualize a URL a cada trimestre (ibpt.org.br)
# {uf} será substituído pelo código do estado durante o sync
ibpt.download.url-template=https://api-ibpt.seunegocionanuvem.com.br/api_ibpt.php?codigo=09012100&uf=PR
ibpt.ufs=AC,AL,AM,AP,BA,CE,DF,ES,GO,MA,MG,MS,MT,PA,PB,PE,PI,PR,RJ,RN,RO,RR,RS,SC,SE,SP,TO

# Provedor de IA: "claude" ou "openai"
ai.provider=openai

# Anthropic — lê ANTHROPIC_API_KEY do ambiente se não configurado aqui
# anthropic.api-key=sk-ant-...

# OpenAI — lê OPENAI_API_KEY do ambiente se não configurado aqui
openai.api-key=${OPENAI_API_KEY}
