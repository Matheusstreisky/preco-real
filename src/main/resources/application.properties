spring.application.name=precoreal

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

# IBPT — atualize a URL a cada trimestre (ibpt.org.br)
# {uf} será substituído pelo código do estado durante o sync
ibpt.download.url-template=https://api-ibpt.seunegocionanuvem.com.br/api_ibpt_json.php?uf={uf}
ibpt.ufs=AC,AL,AM,AP,BA,CE,DF,ES,GO,MA,MG,MS,MT,PA,PB,PE,PI,PR,RJ,RN,RO,RR,RS,SC,SE,SP,TO

# Provedor de IA: "claude" ou "openai"
ai.provider=openai

# Anthropic — lê ANTHROPIC_API_KEY do ambiente se não configurado aqui
# anthropic.api-key=sk-ant-...

# OpenAI — lê OPENAI_API_KEY do ambiente se não configurado aqui
openai.api-key=${OPENAI_API_KEY}
